AWSTemplateFormatVersion: '2010-09-09'
Description: SIS 3 Orders API on ECS Fargate with an asynchronous order consumer
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, defence]
  ImageUri:
    Type: String
    Description: URI of the ECR image including its SHA-256 digest
  RepositoryArn:
    Type: String
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: IPv4 CIDR allowed to reach the demo API on port 80
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues: [1, 2]
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Gateway
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Gateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.0.0/24
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.1.0/24
  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRoutes
  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRoutes
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP to the Orders load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow API requests from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: [InternetRoute, PublicSubnetARoutes, PublicSubnetBRoutes]
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
  ApiTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargets

  OrdersBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${AWS::StackName}-orders'
  OrdersDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDLQ.Arn
        maxReceiveCount: 5
  OrderCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref OrdersBus
      EventPattern:
        source: [sis3.orders]
        detail-type: [OrderCreated]
      State: ENABLED
      Targets:
        - Id: OrdersQueue
          Arn: !GetAtt OrdersQueue.Arn
  OrdersQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref OrdersQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OrdersQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt OrderCreatedRule.Arn
  ProcessedOrders:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProcessOrders
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt OrdersQueue.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ProcessedOrders.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WorkerLogs}:log-stream:*'
  OrderWorker:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt WorkerRole.Arn
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref WorkerLogs
      Environment:
        Variables:
          ORDERS_TABLE: !Ref ProcessedOrders
      Code:
        ZipFile: |
          import json
          import os
          import re
          from datetime import datetime, timezone

          import boto3

          table_name = os.environ["ORDERS_TABLE"]
          dynamodb = boto3.client("dynamodb")
          order_id_pattern = re.compile(r"[A-Za-z0-9_-]{1,64}")

          def handler(event, context):
              failures = []
              for record in event["Records"]:
                  try:
                      envelope = json.loads(record["body"])
                      order_id = envelope["detail"]["orderId"]
                      if not isinstance(order_id, str) or not order_id_pattern.fullmatch(order_id):
                          raise ValueError("Invalid orderId")
                      dynamodb.put_item(
                          TableName=table_name,
                          Item={
                              "orderId": {"S": order_id},
                              "status": {"S": "PROCESSED"},
                              "eventId": {"S": envelope["id"]},
                              "processedAt": {"S": datetime.now(timezone.utc).isoformat()},
                          },
                          ConditionExpression="attribute_not_exists(orderId)",
                      )
                      print(json.dumps({"result": "processed", "orderId": order_id}))
                  except dynamodb.exceptions.ConditionalCheckFailedException:
                      print(json.dumps({"result": "duplicate", "orderId": order_id}))
                  except Exception as error:
                      print(json.dumps({"result": "failed", "messageId": record["messageId"], "error": type(error).__name__}))
                      failures.append({"itemIdentifier": record["messageId"]})
              return {"batchItemFailures": failures}
  OrdersEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt OrdersQueue.Arn
      FunctionName: !Ref OrderWorker
      BatchSize: 5
      FunctionResponseTypes: [ReportBatchItemFailures]

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullImageAndWriteLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Ref RepositoryArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApiLogs}:log-stream:*'
  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PublishOrders
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt OrdersBus.Arn
                Condition:
                  StringEquals:
                    events:source: sis3.orders
                    events:detail-type: OrderCreated
  EcsCluster:
    Type: AWS::ECS::Cluster
  ApiTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: orders-api
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: ORDERS_EVENT_BUS
              Value: !Ref OrdersBus
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, OrdersQueuePolicy, OrdersEventSource]
    Properties:
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref ApiTask
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancers:
        - ContainerName: orders-api
          ContainerPort: 8080
          TargetGroupArn: !Ref ApiTargets
      Tags:
        - Key: Environment
          Value: !Ref Environment
Outputs:
  ApiUrl:
    Value: !Sub 'http://${LoadBalancer.DNSName}'
  OrdersTableName:
    Value: !Ref ProcessedOrders
  QueueUrl:
    Value: !Ref OrdersQueue
  DLQUrl:
    Value: !Ref OrdersDLQ
  WorkerLogGroup:
    Value: !Ref WorkerLogs
  ApiLogGroup:
    Value: !Ref ApiLogs
